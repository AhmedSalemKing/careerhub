# Render blueprint for the DeveWay API.
#
# The API is a NestJS service inside the monorepo, so rootDir points at
# apps/api. Secrets are managed in the Render dashboard and are intentionally
# not stored here.
#
# IMPORTANT: prisma migrate deploy runs during pre-deploy. Prisma uses
# DIRECT_URL for migrations. Supabase's direct host (db.<ref>.supabase.co) is
# IPv6-only and Render cannot reach it, so DIRECT_URL must be set to the
# Supabase session pooler on port 5432, for example:
#   postgresql://postgres.<ref>:<password>@<region>.pooler.supabase.com:5432/postgres
# Do not use the transaction pooler on port 6543 for migrations.

services:
  - type: web
    name: deveway-api
    runtime: node
    plan: free
    rootDir: apps/api
    buildCommand: npm install && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm run start:prod
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.11.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: AGORA_APP_ID
        sync: false
      - key: AGORA_APP_CERTIFICATE
        sync: false
      - key: AGORA_CUSTOMER_KEY
        sync: false
      - key: AGORA_CUSTOMER_SECRET
        sync: false
      - key: AGORA_WEBHOOK_SECRET
        sync: false
      - key: B2_BUCKET
        sync: false
      - key: B2_KEY_ID
        sync: false
      - key: B2_APPLICATION_KEY
        sync: false
      - key: B2_ENDPOINT
        sync: false
      - key: B2_REGION
        sync: false
      - key: BUNNY_LIBRARY_ID
        sync: false
      - key: BUNNY_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
